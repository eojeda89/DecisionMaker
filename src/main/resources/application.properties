spring.application.name=DecididorAPI
server.port=${PORT:8080}

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-shy-mouse-a2t07r14.eu-central-1.pg.koyeb.app/decididor}
spring.datasource.username=${DB_USERNAME:ideadbowner}
spring.datasource.password=${DB_PASSWORD:ideadbowner}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- HikariCP (pool de conexiones) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- Flyway (opcional, requiere dependencia) ---
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration

# --- i18n ---
# Español, inglés y japonés (messages.properties/_es/_en/_ja). El
# LocaleResolver (basado en sesión, default "es") y el interceptor de
# cambio de idioma (?lang=es|en|ja) viven en configuration/WebConfig,
# no acá: spring.mvc.locale-resolver=fixed no admite un LocaleResolver
# personalizado, así que el bean se define directamente.

# --- Actuator / Health ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
