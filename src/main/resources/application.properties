spring.application.name=DecididorAPI
server.port=${PORT:8080}

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-shy-mouse-a2t07r14.eu-central-1.pg.koyeb.app/decididor}
spring.datasource.username=${DB_USERNAME:ideadbowner}
spring.datasource.password=${DB_PASSWORD:ideadbowner}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- HikariCP (pool de conexiones) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- Flyway (opcional, requiere dependencia) ---
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration

# --- i18n ---
# Español fijo por ahora (proyecto mono-idioma). Para soportar más idiomas:
# agregar messages_en.properties (etc.) y cambiar locale-resolver a algo que
# detecte el idioma del cliente (ej. accept-header) en vez de "fixed".
spring.mvc.locale=es
spring.mvc.locale-resolver=fixed

# --- Actuator / Health ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
