# --- Algoritmos de decisión ---
# Claves usadas por domain/service/algorithms/* (vía AlgorithmDetails) y
# resueltas por adapter/in/web/AlgorithmDetailsLocalizer. El nombre coincide
# con AlgorithmType.uiName para que dropdown y resultado sean consistentes.
algorithm.dice-roll.name=Lanzamiento de dados
algorithm.dice-roll.description=Se elige un ganador al azar lanzando un dado.
algorithm.thread-race.name=Carrera de hilos
algorithm.thread-race.description=Se elige un ganador al azar mediante una carrera de hilos.
algorithm.fortune-wheel.name=Rueda de la fortuna
algorithm.fortune-wheel.description=Se elige un ganador al azar girando una ruleta de la fortuna.
algorithm.random-weighted.name=Aleatorio ponderado
algorithm.random-weighted.description=Se elige un ganador al azar mediante un sorteo ponderado por pesos aleatorios.
algorithm.randomized-voting.name=Votación aleatorizada
