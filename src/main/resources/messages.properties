# (ej. accept-header).

# --- Algoritmos de decisión ---
# Claves usadas por domain/service/algorithms/* (vía AlgorithmDetails) y
# resueltas por adapter/in/web/AlgorithmDetailsLocalizer. El nombre coincide
# con AlgorithmType.uiName para que dropdown y resultado sean consistentes.
algorithm.dice-roll.name=Lanzamiento de dados
algorithm.dice-roll.description=Se elige un ganador al azar lanzando un dado.
algorithm.thread-race.name=Carrera de hilos
algorithm.thread-race.description=Se elige un ganador al azar mediante una carrera de hilos.
algorithm.fortune-wheel.name=Rueda de la fortuna
algorithm.fortune-wheel.description=Se elige un ganador al azar girando una ruleta de la fortuna.
algorithm.random-weighted.name=Aleatorio ponderado
algorithm.random-weighted.description=Se elige un ganador al azar mediante un sorteo ponderado por pesos aleatorios.
algorithm.randomized-voting.name=Votación aleatorizada
algorithm.randomized-voting.description=Se elige un ganador al azar simulando un proceso de votación con votos aleatorios.
algorithm.fisher-yates-selection.name=Selección Fisher-Yates
algorithm.fisher-yates-selection.description=Se elige un ganador al azar barajando la lista de opciones y tomando el primer elemento.
algorithm.bracket-tournament.name=Torneo eliminatorio
algorithm.bracket-tournament.description=Las opciones se emparejan al azar y compiten en duelos de eliminación directa hasta que queda una sola.
algorithm.best-of-n.name=Mejor de N
algorithm.best-of-n.description=Se corren varias rondas independientes, cada una con un algoritmo elegido al azar, y gana la opción con más rondas ganadas.

# --- Narrativa paso a paso (Fase 3.7) ---
# Usadas por AlgorithmDetails["steps"] (lista ordenada de {round, descriptionKey,
# args}), resueltas por AlgorithmDetailsLocalizer igual que "algorithm"/
# "description" pero con argumentos posicionales tipo MessageFormat ({0}, {1}...).
narrative.dice-roll=Se tiró un dado de {0} caras: salió {1}.
narrative.fortune-wheel=La ruleta giró y se detuvo en el ángulo {0}°, en el segmento de {1}.
narrative.random-weighted=Se sortearon pesos aleatorios para cada opción y ganó {0} con el sorteo ponderado.
narrative.randomized-voting=Cada opción recibió un voto aleatorio y ganó {0} con el voto más alto.
narrative.fisher-yates-selection=Se barajó la lista de opciones; la primera del mazo barajado fue {0}.
narrative.thread-race=Se largó una carrera de hilos entre las opciones; llegó primero {0}.
narrative.bracket.duel=Ronda {0}: {1} vs. {2} → ganó {3} (cara o cruz).
narrative.bracket.bye=Ronda {0}: {1} pasa directo a la siguiente ronda.
narrative.best-of-n.round=Ronda {0} ({1}): ganó {2}.
narrative.best-of-n.tiebreak=Desempate ({0}) entre {1}: ganó {2}.
narrative.best-of-n.result=Resultado final: {0} ganó {1} de {2} rondas.

