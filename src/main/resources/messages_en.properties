# English bundle (Fase 4, fuera del plan): mismas claves que messages.properties
# (fallback en español) y messages_es.properties, ver WebConfig para el
# LocaleResolver/interceptor que activa este bundle vía "?lang=en".

# --- Algoritmos de decisión ---
# Claves usadas por domain/service/algorithms/* (vía AlgorithmDetails) y
# resueltas por adapter/in/web/AlgorithmDetailsLocalizer. El nombre coincide
# con AlgorithmType.uiName para que dropdown y resultado sean consistentes.
algorithm.dice-roll.name=Dice Roll
algorithm.dice-roll.description=A winner is chosen at random by rolling a die.
algorithm.thread-race.name=Thread Race
algorithm.thread-race.description=A winner is chosen at random through a race between threads.
algorithm.fortune-wheel.name=Wheel of Fortune
algorithm.fortune-wheel.description=A winner is chosen at random by spinning a wheel of fortune.
algorithm.random-weighted.name=Weighted Random
algorithm.random-weighted.description=A winner is chosen at random through a draw weighted by random weights.
algorithm.randomized-voting.name=Randomized Voting
algorithm.randomized-voting.description=A winner is chosen at random by simulating a voting process with random votes.
algorithm.fisher-yates-selection.name=Fisher-Yates Selection
algorithm.fisher-yates-selection.description=A winner is chosen at random by shuffling the list of options and taking the first one.
algorithm.bracket-tournament.name=Elimination Tournament
algorithm.bracket-tournament.description=Options are randomly paired and compete in single-elimination duels until only one remains.
algorithm.best-of-n.name=Best of N
algorithm.best-of-n.description=Several independent rounds are run, each with a randomly chosen algorithm, and the option with the most rounds won wins.
algorithm.daily.name=Decision of the Day
algorithm.daily.description=Deterministic result for today: asking again on the same day always gives the same answer.

# --- Narrativa paso a paso (Fase 3.7) ---
# Usadas por AlgorithmDetails["steps"] (lista ordenada de {round, descriptionKey,
# args}), resueltas por AlgorithmDetailsLocalizer igual que "algorithm"/
# "description" pero con argumentos posicionales tipo MessageFormat ({0}, {1}...).
narrative.dice-roll=A {0}-sided die was rolled: it landed on {1}.
narrative.fortune-wheel=The wheel spun and stopped at {0}°, in {1}''s segment.
narrative.random-weighted=Random weights were drawn for each option, and {0} won the weighted draw.
narrative.randomized-voting=Each option received a random vote, and {0} won with the highest vote.
narrative.fisher-yates-selection=The list of options was shuffled; the first one in the shuffled deck was {0}.
narrative.thread-race=A thread race was started between the options; {0} arrived first.
narrative.bracket.duel=Round {0}: {1} vs. {2} → {3} won (coin toss).
narrative.bracket.bye=Round {0}: {1} advances directly to the next round.
narrative.best-of-n.round=Round {0} ({1}): {2} won.
narrative.best-of-n.tiebreak=Tiebreak ({0}) among {1}: {2} won.
narrative.best-of-n.result=Final result: {0} won {1} of {2} rounds.
narrative.anti-repeat.reroll={0} won {1} of the last {2} decisions with these same options: discarded and re-decided (attempt {3}).
narrative.daily=Today''s date ({0}) was used as a seed to choose reproducibly: {1} came out.

