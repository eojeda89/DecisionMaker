# Japanese bundle (Fase 4, fuera del plan): mismas claves que messages.properties
# (fallback en español) y messages_es.properties, ver WebConfig para el
# LocaleResolver/interceptor que activa este bundle vía "?lang=ja".

# --- Algoritmos de decisión ---
# Claves usadas por domain/service/algorithms/* (vía AlgorithmDetails) y
# resueltas por adapter/in/web/AlgorithmDetailsLocalizer. El nombre coincide
# con AlgorithmType.uiName para que dropdown y resultado sean consistentes.
algorithm.dice-roll.name=サイコロ投げ
algorithm.dice-roll.description=サイコロを振ってランダムに当選者が選ばれます。
algorithm.thread-race.name=スレッドレース
algorithm.thread-race.description=スレッド同士のレースでランダムに当選者が選ばれます。
algorithm.fortune-wheel.name=運命のルーレット
algorithm.fortune-wheel.description=ルーレットを回してランダムに当選者が選ばれます。
algorithm.random-weighted.name=重み付きランダム
algorithm.random-weighted.description=各選択肢にランダムな重みを割り当て、その重み付き抽選で当選者が決まります。
algorithm.randomized-voting.name=ランダム投票
algorithm.randomized-voting.description=各選択肢にランダムな一票が入り、最多得票の選択肢が当選します。
algorithm.fisher-yates-selection.name=フィッシャー・イェーツ選択
algorithm.fisher-yates-selection.description=選択肢のリストをシャッフルし、先頭の選択肢が当選します。
algorithm.bracket-tournament.name=勝ち抜きトーナメント
algorithm.bracket-tournament.description=選択肢がランダムに対戦カードを組み、一つになるまで一発勝負の勝ち抜き戦を行います。
algorithm.best-of-n.name=ベストオブN
algorithm.best-of-n.description=独立した複数ラウンドをそれぞれランダムなアルゴリズムで行い、最も多くのラウンドで勝った選択肢が当選します。
algorithm.daily.name=今日の決定
algorithm.daily.description=今日という日付を使った決定論的な結果です。同じ日にもう一度試しても、必ず同じ答えになります。

# --- Narrativa paso a paso (Fase 3.7) ---
# Usadas por AlgorithmDetails["steps"] (lista ordenada de {round, descriptionKey,
# args}), resueltas por AlgorithmDetailsLocalizer igual que "algorithm"/
# "description" pero con argumentos posicionales tipo MessageFormat ({0}, {1}...).
