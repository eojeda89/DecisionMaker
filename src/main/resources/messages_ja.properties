narrative.fortune-wheel=ルーレットが回り、角度{0}°で止まりました。{1}のマスです。
narrative.random-weighted=各選択肢にランダムな重みを割り当てたところ、{0}が重み付き抽選で当選しました。
narrative.randomized-voting=各選択肢にランダムな一票が入り、{0}が最多得票で当選しました。
narrative.fisher-yates-selection=選択肢のリストをシャッフルしたところ、先頭は{0}でした。
narrative.thread-race=選択肢同士でスレッドレースを行ったところ、{0}が最初にゴールしました。
narrative.bracket.duel=第{0}ラウンド: {1} 対 {2} → {3}の勝利（コイントス）。
narrative.bracket.bye=第{0}ラウンド: {1}はシード扱いで次のラウンドに進みます。
narrative.best-of-n.round=第{0}ラウンド（{1}）: {2}の勝利。
narrative.best-of-n.tiebreak=タイブレーク（{0}）: {1}の中から{2}が勝利しました。
narrative.best-of-n.result=最終結果: 全{2}ラウンド中{1}ラウンドを{0}が制しました。
narrative.anti-repeat.reroll={0}は同じ選択肢での直近{2}回の決定のうち{1}回勝っているため、この結果を破棄してもう一度決定します（試行{3}回目）。
narrative.daily=今日の日付（{0}）をシードとして再現可能な方法で選んだ結果、{1}が選ばれました。

