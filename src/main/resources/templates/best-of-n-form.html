<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script th:src="@{/js/dark-mode.js}"></script>
    <title th:text="#{bestOfN.title}">Mejor de N</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar(${username})}"></div>
<div class="container">
    <h1 th:text="#{bestOfN.heading}">Mejor de N</h1>
    <p th:text="#{bestOfN.intro}">Se corren varias rondas independientes con un algoritmo al azar en cada una; gana la opción con más rondas ganadas.</p>
    <form action="/decide/best-of-n" method="post">

        <div id="container-options">
            <h2 th:text="#{decide.optionsHeading}">Deja que el destino decida por tí.</h2>
            <div>
                <label for="option1" th:text="#{decide.option1Label}">Opción 1:</label>
                <input type="text" id="option1" name="options">
            </div>
            <div>
                <label for="option2" th:text="#{decide.option2Label}">Opción 2:</label>
                <input type="text" id="option2" name="options">
            </div>
        </div>

        <div>
            <button type="button" id="add-option" th:text="#{decide.addOption}">Agregar otra opción</button>
        </div>

        <div>
            <label for="rounds" th:text="#{bestOfN.roundsLabel}">Cantidad de rondas:</label>
            <select id="rounds" name="rounds">
                <option value="3">3</option>
                <option value="5">5</option>
                <option value="7">7</option>
            </select>
        </div>

        <div>
            <label th:text="#{bestOfN.algorithmsLabel}">Restringir el sorteo a estos algoritmos (opcional; si no se marca ninguno, se usan todos):</label>
            <div class="checkbox-group">
                <label class="checkbox-label" th:each="algorithm : ${algorithms}">
                    <input type="checkbox" name="algorithms" th:value="${algorithm.code}">
                    <span th:text="${algorithm.uiName}"></span>
                </label>
            </div>
        </div>

        <button type="submit" th:text="#{bestOfN.submit}">¡Correr las rondas!</button>
    </form>
</div>
<script th:src="@{/js/script-decision-option.js}"></script>
</body>
</html>
