<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script th:src="@{/js/dark-mode.js}"></script>
    <title th:text="#{daily.title}">Decisión del día</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar(${username})}"></div>
<div class="container">
    <h1 th:text="#{daily.heading}">Decisión del día</h1>
    <p th:text="#{daily.intro}">Resultado fijo para hoy: repetir esta misma lista de opciones el mismo día siempre da la misma respuesta. No queda guardada en el historial.</p>
    <form action="/decide/daily" method="post">

        <div id="container-options">
            <h2 th:text="#{decide.optionsHeading}">Deja que el destino decida por tí.</h2>
            <div>
                <label for="option1" th:text="#{decide.option1Label}">Opción 1:</label>
                <input type="text" id="option1" name="options">
            </div>
            <div>
                <label for="option2" th:text="#{decide.option2Label}">Opción 2:</label>
                <input type="text" id="option2" name="options">
            </div>
        </div>

        <div>
            <button type="button" id="add-option" th:text="#{decide.addOption}">Agregar otra opción</button>
        </div>

        <button type="submit" th:text="#{daily.submit}">Ver la decisión de hoy</button>
    </form>
</div>
<script th:src="@{/js/script-decision-option.js}"></script>
</body>
</html>
