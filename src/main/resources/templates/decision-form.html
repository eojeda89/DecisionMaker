<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script th:src="@{/js/dark-mode.js}"></script>
    <title th:text="#{decide.title}">Decididor 2.0</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div class="logout">
    <button id="dark-mode-toggle" type="button" class="theme-toggle" th:title="#{nav.toggleTheme}">🌙</button>
    <a th:href="@{/logout}" th:text="#{nav.logout}">Cerrar Sesión</a>
</div>
<div class="container">
    <h1 th:text="#{decide.heading}">Decididor 2.0</h1>
    <p th:text="#{decide.welcome}">¡Bienvenido al Decididor 2.0! Aquí puedes tomar decisiones de manera divertida y aleatoria.</p>
    <form action="/decide" method="post">

        <div id="container-options">
            <h2 th:text="#{decide.optionsHeading}">Deja que el destino decida por tí.</h2>
            <div>
                <label for="option1" th:text="#{decide.option1Label}">Opción 1:</label>
                <input type="text" id="option1" name="options">
            </div>
            <div>
                <label for="option2" th:text="#{decide.option2Label}">Opción 2:</label>
                <input type="text" id="option2" name="options">
            </div>
        </div>

        <div>
            <button type="button" id="add-option" th:text="#{decide.addOption}">Agregar otra opción</button>
        </div>

        <div>
            <label for="algorithm" th:text="#{decide.algorithmLabel}">Elige un Algoritmo:</label>
            <select id="algorithm" name="algorithm">
                <!-- Iteramos sobre la lista de algoritmos -->
                <option th:each="algorithm : ${algorithms}"
                        th:value="${algorithm.code}"
                        th:text="${algorithm.uiName}">
                </option>
            </select>
        </div>

        <button type="submit" th:text="#{decide.submit}">¡Decidir!</button>
    </form>
</div>
<!-- Enlace al archivo de script externo -->
<script th:src="@{/js/script-decision-option.js}"></script>
</body>
</html>
