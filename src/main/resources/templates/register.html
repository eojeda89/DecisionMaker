<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/js/dark-mode.js}"></script>
    <title th:text="#{register.title}">Registro</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div class="logout">
    <button id="dark-mode-toggle" type="button" class="theme-toggle" th:title="#{nav.toggleTheme}">🌙</button>
</div>
<div class="container">
    <h1 th:text="#{register.heading}">Crear Cuenta</h1>

    <div th:if="${param.error}" style="color:red; margin-bottom: 1rem;" th:text="#{register.error}">
        Error al registrar el usuario. Por favor, inténtalo de nuevo.
    </div>

    <form th:action="@{/register}" method="post">
        <div>
            <label for="username" th:text="#{register.usernameLabel}">Usuario:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="email" th:text="#{register.emailLabel}">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="password" th:text="#{register.passwordLabel}">Contraseña:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div>
            <button type="submit" th:text="#{register.submit}">Crear Cuenta</button>
        </div>

        <div><a th:href="@{/login}" th:text="#{register.loginLink}">¿Ya tienes cuenta? Inicia sesión.</a></div>
    </form>


</div>
</body>
</html>
