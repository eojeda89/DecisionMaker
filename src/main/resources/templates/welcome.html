<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{welcome.title}">Bienvenido</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<div class="logout">
    <a th:href="@{/logout}" th:text="#{nav.logout}">Cerrar Sesión</a>
</div>
<div class="container">
    <div th:if="${username}">
        <h1 th:text="#{welcome.heading(${username})}">¡Bienvenido, usuario!</h1>
        <p th:text="#{welcome.subtitle}">Estás en tu página principal. ¡Listo para tomar una decisión!</p>

        <a th:href="@{/form}" style="display: block; margin-top: 20px;" th:text="#{welcome.goToForm}">Ir al formulario de decisión</a>
    </div>

    <div th:unless="${username}">
        <p th:text="#{welcome.notAuthenticated}">No estás autenticado.</p>
        <a th:href="@{/login}" th:text="#{welcome.goToLogin}">Ir a Iniciar Sesión</a>
    </div>
</div>
</body>
</html>
