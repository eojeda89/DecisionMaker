spring.application.name=DecididorAPI

# --- Database (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/decididor}
spring.datasource.username=${DB_USERNAME:ideadbowner}
spring.datasource.password=${DB_PASSWORD:ideadbowner}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- HikariCP (pool de conexiones) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- Flyway (opcional, requiere dependencia) ---
# spring.flyway.enabled=true
# spring.flyway.locations=classpath:db/migration

# --- i18n ---
spring.mvc.locale=es
spring.mvc.locale-resolver=fixed

# --- Actuator / Health ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
